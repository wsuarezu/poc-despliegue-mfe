name: Publicar shell

on:
  push:
    branches: [main]
    paths: ['shell-demo/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir el shell a gh-pages/shell
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./shell-demo
          destination_dir: shell
          keep_files: true
          commit_message: 'shell: publicación'
