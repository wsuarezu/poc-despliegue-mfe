<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shell demo</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
      header { background: #b71c1c; color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
      button { padding: 6px 12px; cursor: pointer; }
      main { padding: 16px; display: grid; gap: 16px; }
      #zona-mfe { background: #fff; min-height: 120px; padding: 16px; border: 1px dashed #999; }
      pre { background: #263238; color: #eceff1; padding: 12px; overflow-x: auto; margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Shell demo</h1>
      <button id="boton-montar">Montar MFE</button>
      <button id="boton-desmontar">Desmontar</button>
      <span id="estado">Sin módulo montado</span>
    </header>
    <main>
      <div id="zona-mfe"></div>
      <div>
        <strong>Manifiesto leído</strong>
        <pre id="vista-manifiesto">Todavía no se leyó</pre>
      </div>
    </main>
    <script type="module" src="./shell.js"></script>
  </body>
</html>
